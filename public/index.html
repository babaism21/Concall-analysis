<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concall Analysis — Management Health</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a222c;
        --text: #e7ecf1;
        --muted: #8b9aab;
        --accent: #3d9cf0;
        --good: #3ecf8e;
        --avg: #e6b84d;
        --weak: #e57373;
        --border: #2a3542;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #1b3a55 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #243248 0%, transparent 50%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      h1 {
        font-family: "IBM Plex Serif", Georgia, serif;
        font-weight: 600;
        font-size: 2rem;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      .sub { color: var(--muted); margin-bottom: 28px; }
      form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      input {
        flex: 1;
        min-width: 160px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 1rem;
        text-transform: uppercase;
      }
      button {
        background: var(--accent);
        color: #041018;
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .score-row {
        display: flex;
        gap: 24px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .gauge {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.6rem;
        font-weight: 700;
        border: 4px solid var(--border);
      }
      .gauge.Good { border-color: var(--good); color: var(--good); }
      .gauge.Average { border-color: var(--avg); color: var(--avg); }
      .gauge.Weak { border-color: var(--weak); color: var(--weak); }
      .meta { color: var(--muted); font-size: 0.92rem; }
      h2 { font-size: 1.05rem; margin: 24px 0 10px; }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 6px 0; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 500; }
      .err { color: var(--weak); margin-top: 12px; }
      .timeline {
        display: grid;
        gap: 8px;
      }
      .t-item {
        display: grid;
        grid-template-columns: 90px 40px 1fr;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.9rem;
      }
      pre {
        white-space: pre-wrap;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        font-size: 0.85rem;
        max-height: 420px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Management Health</h1>
      <p class="sub">Analyze once, then reuse until a newer concall appears.</p>
      <form id="f">
        <input id="symbol" placeholder="HDFCBANK" value="HDFCBANK" required />
        <button type="submit" id="showBtn">Show</button>
        <button type="button" class="secondary" id="updateBtn">Check for updates</button>
      </form>
      <div id="out"></div>
      <p class="err" id="err"></p>
    </main>
    <script>
      const out = document.getElementById("out");
      const err = document.getElementById("err");
      const form = document.getElementById("f");
      const updateBtn = document.getElementById("updateBtn");

      function render(data) {
        err.textContent = "";
        const j = data.portfolioJson;
        const flags = (j.redFlags || []).map((f) => `<li>${escapeHtml(f)}</li>`).join("") || "<li>None material</li>";
        const rows = (j.commitments || [])
          .map(
            (c) => `<tr>
              <td>${escapeHtml(c.quarter)}</td>
              <td>${escapeHtml(c.commitment)}</td>
              <td>${escapeHtml(c.status)}</td>
              <td>${escapeHtml(c.evidence || "")}</td>
            </tr>`
          )
          .join("");
        const timeline = (j.timeline || [])
          .map(
            (t) => `<div class="t-item"><strong>${escapeHtml(t.quarter)}</strong><span>${t.score}</span><span>${escapeHtml(t.note)}</span></div>`
          )
          .join("");
        const statusBits = [
          data.cacheHit ? "cached" : "fresh",
          data.source || "",
          data.updateAvailable ? "newer concall available — set API key to refresh" : "",
        ].filter(Boolean);
        out.innerHTML = `
          <div class="score-row">
            <div class="gauge ${escapeHtml(j.label)}">${j.healthScore}</div>
            <div>
              <div><strong>${escapeHtml(j.symbol)}</strong> — ${escapeHtml(j.label)}</div>
              <div class="meta">LLM timeline avg: ${j.rawScore ?? "—"} · ${j.transcriptCount} transcripts · ${escapeHtml(statusBits.join(" · "))}</div>
              <p>${escapeHtml(j.summary || "")}</p>
            </div>
          </div>
          <h2>Red flags</h2>
          <ul>${flags}</ul>
          <h2>Commitments</h2>
          <table>
            <thead><tr><th>Quarter</th><th>Commitment</th><th>Status</th><th>Evidence</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <h2>Timeline</h2>
          <div class="timeline">${timeline || "<div class='meta'>No timeline extracted</div>"}</div>
          <h2>Full markdown</h2>
          <pre>${escapeHtml(data.markdown || "")}</pre>
        `;
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      async function run(mode) {
        const symbol = document.getElementById("symbol").value.trim().toUpperCase();
        if (!symbol) return;
        err.textContent = "";
        out.innerHTML = "<p class='meta'>Working…</p>";
        form.querySelectorAll("button").forEach((b) => (b.disabled = true));
        try {
          let res;
          if (mode === "show") {
            // Read-only: SQLite cache or bundled examples — never calls LLM
            res = await fetch("/analysis/" + encodeURIComponent(symbol));
          } else {
            // Discover newest concall; reuse cache if unchanged; LLM only if new/forced
            res = await fetch("/analyze/" + encodeURIComponent(symbol), { method: "POST" });
          }
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          render(data);
        } catch (e) {
          out.innerHTML = "";
          err.textContent = e.message || String(e);
        } finally {
          form.querySelectorAll("button").forEach((b) => (b.disabled = false));
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        run("show");
      });
      updateBtn.addEventListener("click", () => run("update"));
      // Auto-show bundled/cached HDFCBANK on load
      run("show");
    </script>
  </body>
</html>
