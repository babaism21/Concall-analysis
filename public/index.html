<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concall Analysis — Promised vs Delivered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c1014;
        --panel: #151b22;
        --panel2: #1b232d;
        --text: #e8eef4;
        --muted: #8b9aab;
        --accent: #4aa3f0;
        --good: #3ecf8e;
        --avg: #e6b84d;
        --weak: #e57373;
        --open: #7aa2ff;
        --risk: #f0a060;
        --border: #2a3542;
        --mark: #5c3d12;
        --mark-text: #ffd59a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(1000px 520px at 0% -10%, #1a3348 0%, transparent 55%),
          radial-gradient(800px 480px at 100% 0%, #1f2a22 0%, transparent 45%),
          var(--bg);
        color: var(--text);
      }
      .shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 10px 14px 8px;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 1.35rem;
        margin: 0;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .sub { display: none; }
      .top {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        align-items: center;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      .top h1 { flex-shrink: 0; margin-right: 4px; }
      .symbol-search {
        position: relative;
        flex: 1;
        min-width: 140px;
      }
      .symbol-search input {
        width: 100%;
        box-sizing: border-box;
        flex: none;
        min-width: 0;
      }
      .symbol-menu {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        z-index: 40;
        max-height: min(320px, 50vh);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        padding: 4px;
      }
      .symbol-menu.open { display: block; }
      .symbol-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--text);
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        font-weight: 600;
        font-size: 0.88rem;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      .symbol-menu button:hover,
      .symbol-menu button.active {
        background: #1a2a3a;
        color: var(--accent);
      }
      .symbol-menu .empty {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 10px;
      }
      input {
        flex: 1;
        min-width: 100px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.95rem;
        text-transform: uppercase;
      }
      button {
        background: var(--accent);
        color: #041018;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      #score:empty { display: none; }
      .score-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      .gauge {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.95rem;
        font-weight: 700;
        border: 2px solid var(--border);
        flex-shrink: 0;
      }
      .gauge.Good { border-color: var(--good); color: var(--good); }
      .gauge.Average { border-color: var(--avg); color: var(--avg); }
      .gauge.Weak { border-color: var(--weak); color: var(--weak); }
      .score-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
      }
      .score-title {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: baseline;
        font-size: 0.92rem;
        flex-shrink: 0;
      }
      .score-title .qtr-pill {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
      }
      .score-title .trend {
        font-size: 0.75rem;
        font-weight: 600;
      }
      .score-title .trend.up { color: var(--good); }
      .score-title .trend.down { color: var(--weak); }
      .score-title .trend.flat { color: var(--muted); }
      .meta {
        color: var(--muted);
        font-size: 0.7rem;
        white-space: nowrap;
      }
      .qtr-history {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 0;
        margin: 0;
        scrollbar-width: thin;
        flex: 1 1 180px;
        min-width: 0;
        align-items: center;
      }
      .qtr-chip {
        flex: 0 0 auto;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
        border-radius: 7px;
        padding: 3px 7px;
        cursor: pointer;
        text-align: left;
        min-width: 0;
        font: inherit;
        line-height: 1.15;
      }
      .qtr-chip:hover { border-color: var(--accent); }
      .qtr-chip.on {
        border-color: var(--accent);
        background: #1a2a3a;
      }
      .qtr-chip .q { font-size: 0.6rem; color: var(--muted); display: inline; margin-right: 4px; }
      .qtr-chip .s {
        font-size: 0.85rem;
        font-weight: 700;
        display: inline;
      }
      .qtr-chip .s.Good { color: var(--good); }
      .qtr-chip .s.Average { color: var(--avg); }
      .qtr-chip .s.Weak { color: var(--weak); }
      .qtr-chip .delta {
        font-size: 0.6rem;
        color: var(--muted);
        margin-left: 3px;
      }
      .qtr-chip .delta.up { color: var(--good); }
      .qtr-chip .delta.down { color: var(--weak); }
      .qtr-chip .px {
        display: block;
        font-size: 0.62rem;
        color: var(--muted);
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .qtr-chip .px .up { color: var(--good); }
      .qtr-chip .px .down { color: var(--weak); }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        flex: 1 1 auto;
        min-height: 0;
        height: 0;
        align-items: stretch;
      }
      /* author .layout { display:grid } otherwise beats the [hidden] UA rule */
      .layout[hidden] {
        display: none !important;
      }
      .layout.tx-open {
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 960px) {
        html, body { overflow: auto; height: auto; }
        .shell { height: auto; overflow: auto; }
        .layout, .layout.tx-open { grid-template-columns: 1fr; height: auto; min-height: 50vh; }
      }
      .col {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
        max-height: 100%;
      }
      .col.transcript-col {
        display: none;
      }
      .layout.tx-open .col.transcript-col {
        display: flex;
      }
      .col-h {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--panel);
      }
      .col-h h2 {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .tx-close {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 4px 10px;
        font-size: 0.78rem;
        border-radius: 6px;
      }
      .tx-close:hover { color: var(--text); border-color: var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; }
      .chip {
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--muted);
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .chip.on { color: var(--text); border-color: var(--accent); background: #1a2a3a; }
      .chip .n {
        display: inline-block;
        margin-left: 3px;
        opacity: 0.75;
      }
      .cards {
        padding: 8px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-height: 0;
      }
      .card {
        text-align: left;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 11px 8px;
        cursor: pointer;
        color: inherit;
        font: inherit;
        width: 100%;
      }
      .card:hover, .card.active {
        border-color: var(--accent);
        background: #1a2836;
      }
      .card .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .tag {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 999px;
      }
      .tag.delivered { background: #163528; color: var(--good); }
      .tag.missed { background: #3a1c1c; color: var(--weak); }
      .tag.open { background: #1c2740; color: var(--open); }
      .tag.risk { background: #3a2818; color: var(--risk); }
      .tag.guidance { background: #243040; color: var(--accent); }
      .tag.positive { background: #163528; color: #7dcea0; }
      .tag.negative { background: #3a1c1c; color: #f1948a; }
      .qtr { color: var(--muted); font-size: 0.75rem; }
      .card strong { display: block; font-size: 0.88rem; margin-bottom: 3px; }
      .card p { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
      .card .jump {
        margin-top: 6px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .tx-tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tx-tools select {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        max-width: 200px;
        font-size: 0.8rem;
      }
      .transcript {
        flex: 1 1 auto;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 12px 14px 32px;
        white-space: pre-wrap;
        font-size: 0.84rem;
        line-height: 1.5;
        color: #c9d4e0;
        min-height: 0;
        position: relative;
      }
      .transcript mark.passage {
        background: rgba(92, 61, 18, 0.55);
        color: var(--mark-text);
        padding: 0 2px;
        border-radius: 4px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .transcript mark.core {
        background: #8a5a12;
        color: #ffe6b0;
        padding: 0 1px;
        border-radius: 2px;
      }
      .transcript mark#hit {
        outline: 1px solid rgba(230, 184, 77, 0.55);
        box-shadow: 0 0 0 3px rgba(230, 184, 77, 0.18);
      }
      .empty {
        color: var(--muted);
        padding: 24px 14px;
        text-align: center;
        font-size: 0.9rem;
      }
      .err { color: var(--weak); margin-top: 6px; min-height: 1.1em; flex-shrink: 0; font-size: 0.85rem; }
      .hint {
        color: var(--muted);
        font-size: 0.75rem;
        padding: 6px 12px;
        margin: 0;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
        background: var(--panel2);
      }
      .cards-hint {
        color: var(--muted);
        font-size: 0.75rem;
        padding: 0 4px 4px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <form class="top" id="f" autocomplete="off">
        <h1>Management Health</h1>
        <div class="symbol-search" id="symbolSearch">
          <input
            id="symbol"
            placeholder="Search symbol…"
            value=""
            required
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="symbolMenu"
            aria-expanded="false"
          />
          <div class="symbol-menu" id="symbolMenu" role="listbox" hidden></div>
        </div>
        <button type="submit">Show</button>
        <button type="button" class="secondary" id="updateBtn">Check for updates</button>
      </form>
      <div id="score"></div>
      <div class="layout" id="layout" hidden>
        <section class="col">
          <div class="col-h">
            <h2>Insights</h2>
            <div class="chips" id="chips"></div>
          </div>
          <p class="cards-hint">Click a card to open the transcript on the right.</p>
          <div class="cards" id="cards"></div>
        </section>
        <section class="col transcript-col" id="transcriptCol">
          <div class="col-h">
            <h2>Transcript</h2>
            <div class="tx-tools">
              <select id="txSelect" aria-label="Select quarter transcript"></select>
              <button type="button" class="tx-close" id="txClose" title="Close transcript">Close</button>
            </div>
          </div>
          <p class="hint" id="txHint">Passage linked from the selected insight.</p>
          <div class="transcript" id="transcript"></div>
        </section>
      </div>
      <p class="err" id="err"></p>
    </div>
    <script>
      const state = {
        data: null,
        filter: "all",
        activeId: null,
        quarterKey: null,
        txIndex: 0,
        txOpen: false,
        symbols: [],
        menuOpen: false,
        menuActive: -1,
        fetchGen: 0,
      };

      const el = (id) => document.getElementById(id);

      function clearView(message) {
        state.data = null;
        state.activeId = null;
        state.quarterKey = null;
        state.txIndex = 0;
        state.filter = "all";
        el("layout").hidden = true;
        el("score").innerHTML = "";
        el("transcript").textContent = "";
        setTranscriptOpen(false);
        el("err").textContent = message || "";
      }

      function setMenuOpen(open) {
        state.menuOpen = Boolean(open);
        const menu = el("symbolMenu");
        menu.classList.toggle("open", state.menuOpen);
        menu.hidden = !state.menuOpen;
        el("symbol").setAttribute("aria-expanded", state.menuOpen ? "true" : "false");
        if (!state.menuOpen) state.menuActive = -1;
      }

      function filteredSymbols(query) {
        const q = String(query || "").trim().toUpperCase();
        const list = state.symbols;
        if (!q) return list.slice(0, 40);
        return list.filter((s) => s.includes(q)).slice(0, 40);
      }

      function renderSymbolMenu() {
        const menu = el("symbolMenu");
        const q = el("symbol").value;
        const matches = filteredSymbols(q);
        if (!matches.length) {
          menu.innerHTML = `<div class="empty">${
            state.symbols.length
              ? "No matching symbols"
              : "No analyzed stocks yet — backfill still running"
          }</div>`;
          state.menuActive = -1;
          return;
        }
        if (state.menuActive >= matches.length) state.menuActive = matches.length - 1;
        menu.innerHTML = matches
          .map(
            (s, i) =>
              `<button type="button" role="option" data-symbol="${escapeHtml(s)}" class="${
                i === state.menuActive ? "active" : ""
              }">${escapeHtml(s)}</button>`
          )
          .join("");
      }

      async function loadSymbolList() {
        try {
          const res = await fetch("/v1/stocks");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          state.symbols = Array.isArray(data.symbols)
            ? data.symbols.map((s) => String(s).toUpperCase())
            : [];
          if (state.menuOpen) renderSymbolMenu();
        } catch (e) {
          console.warn("symbol list failed", e);
        }
      }

      function pickSymbol(symbol) {
        const sym = String(symbol || "").trim().toUpperCase();
        if (!sym) return;
        el("symbol").value = sym;
        setMenuOpen(false);
        el("err").textContent = "";
        run("show");
      }

      function setTranscriptOpen(open) {
        state.txOpen = Boolean(open);
        el("layout").classList.toggle("tx-open", state.txOpen);
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function bucket(status) {
        if (status === "Met" || status === "Partially Completed") return "delivered";
        if (status === "Not Met") return "missed";
        return "open";
      }

      function quarterKeyFromLabel(label) {
        const m = String(label || "").match(/Q[1-4]FY\d{2}/i);
        return m ? m[0].toUpperCase() : "";
      }

      function cardsFromData(data) {
        const j = data.portfolioJson;
        const insights = Array.isArray(j.insights) && j.insights.length
          ? j.insights
          : (j.commitments || []).map((c, i) => ({
              id: "c-" + i,
              kind: bucket(c.status),
              title: c.commitment,
              body: c.evidence || "",
              quarter: c.quarter,
              status: c.status,
              quote: c.quote || c.evidence || "",
              callDate: c.callDate,
              sourceUrl: c.sourceUrl,
              charOffset: c.charOffset,
            }));
        return insights;
      }

      function isOpenKind(kind) {
        // LLM marks forward commitments as "guidance"; treat as still-open for filters/counts
        return kind === "open" || kind === "guidance";
      }

      function counts(cards) {
        const c = {
          all: cards.length,
          positive: 0,
          negative: 0,
          delivered: 0,
          missed: 0,
          open: 0,
          risk: 0,
        };
        for (const x of cards) {
          if (x.kind === "positive") c.positive++;
          else if (x.kind === "negative") c.negative++;
          else if (x.kind === "delivered") c.delivered++;
          else if (x.kind === "missed") c.missed++;
          else if (isOpenKind(x.kind)) c.open++;
          else if (x.kind === "risk") c.risk++;
          else c.open++;
        }
        return c;
      }

      /** Timeline scores are often 0–10; UI gauge is 0–100. */
      function toHundred(score) {
        const n = Number(score);
        if (!Number.isFinite(n)) return null;
        return n <= 10 ? Math.round(n * 10) : Math.round(n);
      }

      function labelFromScore(score100) {
        if (score100 == null) return "Weak";
        if (score100 >= 75) return "Good";
        if (score100 >= 50) return "Average";
        return "Weak";
      }

      /**
       * Indian FY quarters (Apr–Mar): Q1=Apr–Jun … Q4=Jan–Mar.
       * Returned newest → oldest for the chip row. Deltas are still vs the prior FY quarter.
       * Duplicate quarters (e.g. two Q4FY26 calls) are averaged.
       */
      function quarterHistory(data) {
        const raw = Array.isArray(data.portfolioJson?.timeline)
          ? data.portfolioJson.timeline
          : [];
        const map = new Map();
        for (const t of raw) {
          const q = String(t.quarter || "")
            .match(/Q[1-4]FY\d{2}/i)?.[0]
            ?.toUpperCase();
          if (!q) continue;
          const s = toHundred(t.score);
          if (s == null) continue;
          const prev = map.get(q);
          if (!prev) map.set(q, { quarter: q, score: s, note: t.note || "", n: 1 });
          else {
            map.set(q, {
              quarter: q,
              score: Math.round((prev.score * prev.n + s) / (prev.n + 1)),
              note: t.note || prev.note,
              n: prev.n + 1,
            });
          }
        }
        // Transcripts are newest-first → reverse to build oldest→newest for deltas
        const txOrder = (data.transcripts || [])
          .map((t) => String(t.fyQuarter || "").toUpperCase())
          .filter(Boolean);
        const seen = new Set();
        const oldestFirst = [];
        for (const q of [...txOrder].reverse()) {
          if (seen.has(q) || !map.has(q)) continue;
          seen.add(q);
          oldestFirst.push(map.get(q));
        }
        for (const [q, v] of map) {
          if (!seen.has(q)) oldestFirst.push(v);
        }
        const withDelta = oldestFirst.map((v, i, arr) => {
          const prev = i > 0 ? arr[i - 1].score : null;
          const delta = prev == null ? null : v.score - prev;
          return { ...v, delta, label: labelFromScore(v.score) };
        });
        // UI shows latest first
        return withDelta.reverse();
      }

      function activeQuarterScore(data) {
        const hist = quarterHistory(data);
        const j = data.portfolioJson;
        // Prefer selected quarter; otherwise latest (first chip)
        const pick =
          (state.quarterKey && hist.find((h) => h.quarter === state.quarterKey)) ||
          (hist.length ? hist[0] : null);
        if (pick) {
          return {
            quarter: pick.quarter,
            score: pick.score,
            label: pick.label,
            note: pick.note || "",
            delta: pick.delta,
            overall: false,
          };
        }
        return {
          quarter: state.quarterKey || "—",
          score: j.healthScore,
          label: j.label,
          note: j.summary || "",
          delta: null,
          overall: true,
        };
      }

      function trendText(delta) {
        if (delta == null) return { cls: "flat", text: "—" };
        if (delta > 0) return { cls: "up", text: `▲ +${delta} vs prior` };
        if (delta < 0) return { cls: "down", text: `▼ ${delta} vs prior` };
        return { cls: "flat", text: "● flat vs prior" };
      }

      function renderScore(data) {
        const j = data.portfolioJson;
        const active = activeQuarterScore(data);
        const hist = quarterHistory(data);
        const trend = trendText(active.delta);

        const historyHtml = hist.length
          ? `<div class="qtr-history" id="qtrHistory" title="Indian FY (Apr–Mar) · latest first · price = close on call/filing day">
              ${hist
                .map((h) => {
                  const d =
                    h.delta == null
                      ? ""
                      : h.delta > 0
                        ? `▲${h.delta}`
                        : h.delta < 0
                          ? `▼${Math.abs(h.delta)}`
                          : "●0";
                  const dCls =
                    h.delta == null ? "" : h.delta > 0 ? "up" : h.delta < 0 ? "down" : "";
                  const on =
                    (state.quarterKey && h.quarter === state.quarterKey) ||
                    (!state.quarterKey && h === hist[0])
                      ? "on"
                      : "";
                  const px = (data.quarterPrices || []).find(
                    (p) => String(p.quarter || "").toUpperCase() === h.quarter
                  );
                  let pxHtml = "";
                  if (px?.price?.close != null) {
                    const ch = px.price.dayChangePct;
                    const chCls = ch == null ? "" : ch > 0 ? "up" : ch < 0 ? "down" : "";
                    const chTxt =
                      ch == null ? "" : ` <span class="${chCls}">${ch > 0 ? "+" : ""}${ch}%</span>`;
                    pxHtml = `<span class="px" title="NSE close on ${escapeHtml(px.price.date)} (call ${escapeHtml(px.callDate)})">₹${Number(px.price.close).toLocaleString("en-IN")}${chTxt}</span>`;
                  }
                  return `<button type="button" class="qtr-chip ${on}" data-q="${escapeHtml(h.quarter)}" title="${escapeHtml(h.note || h.quarter)}">
                    <span class="q">${escapeHtml(h.quarter)}</span>
                    <span class="s ${escapeHtml(h.label)}">${h.score}</span>
                    <span class="delta ${dCls}">${d}</span>
                    ${pxHtml}
                  </button>`;
                })
                .join("")}
            </div>`
          : `<span class="meta" id="qtrHistory">No quarter history yet</span>`;

        el("score").innerHTML = `
          <div class="score-row">
            <div class="gauge ${escapeHtml(active.label)}" title="Quarter score">${active.score}</div>
            <div class="score-main">
              <div class="score-title">
                <strong>${escapeHtml(j.symbol)}</strong>
                <span class="qtr-pill">${escapeHtml(active.quarter)}</span>
                <span>${escapeHtml(active.label)}</span>
                <span class="trend ${trend.cls}">${escapeHtml(trend.text)}</span>
              </div>
              <span class="meta">overall ${j.healthScore} · ${(data.transcripts || []).length} tx</span>
              ${historyHtml}
            </div>
          </div>`;

        const histEl = el("qtrHistory");
        if (histEl) {
          histEl.onclick = (e) => {
            const b = e.target.closest("[data-q]");
            if (!b || !state.data) return;
            const q = b.getAttribute("data-q");
            // Click active quarter again → show all cards
            state.quarterKey = state.quarterKey === q ? null : q;
            state.activeId = null;
            const txs = state.data.transcripts || [];
            if (state.quarterKey) {
              const idx = txs.findIndex((t) => t.fyQuarter.toUpperCase() === state.quarterKey);
              if (idx >= 0) state.txIndex = idx;
            }
            setTranscriptOpen(false);
            renderScore(state.data);
            renderChips(filteredCardsBase());
            renderCards();
          };
        }
      }

      function renderChips(cards) {
        const c = counts(cards);
        const items = [
          ["all", "All"],
          ["positive", "Positive"],
          ["negative", "Negative"],
          ["delivered", "Delivered"],
          ["missed", "Missed"],
          ["open", "Still open"],
          ["risk", "Risks"],
        ];
        el("chips").innerHTML = items
          .map(
            ([k, label]) =>
              `<button type="button" class="chip ${state.filter === k ? "on" : ""}" data-f="${k}">${label}<span class="n">${c[k] ?? 0}</span></button>`
          )
          .join("");
        el("chips").onclick = (e) => {
          const b = e.target.closest("[data-f]");
          if (!b) return;
          state.filter = b.getAttribute("data-f");
          renderCards();
          renderChips(filteredCardsBase());
        };
      }

      function cardMatchesTranscript(card, t) {
        if (!t) return true;
        if (card.callDate && t.callDate && card.callDate === t.callDate) return true;
        if (card.sourceUrl && t.sourceUrl && card.sourceUrl === t.sourceUrl) return true;
        const q = quarterKeyFromLabel(card.quarter);
        if (q && q === t.fyQuarter.toUpperCase()) return true;
        return false;
      }

      function filteredCardsBase() {
        let cards = cardsFromData(state.data);
        if (!state.quarterKey) return cards;
        const q = state.quarterKey;
        const txs = state.data.transcripts || [];
        const t =
          txs.find((x) => String(x.fyQuarter || "").toUpperCase() === q) ||
          txs[state.txIndex];
        return cards.filter((x) => {
          const cq = quarterKeyFromLabel(x.quarter);
          if (cq && cq === q) return true;
          if (t && cardMatchesTranscript(x, t)) return true;
          // Unscoped cards still useful within a quarter view
          if (
            !cq &&
            (x.kind === "risk" ||
              x.kind === "positive" ||
              x.kind === "negative" ||
              isOpenKind(x.kind) ||
              x.kind === "delivered" ||
              x.kind === "missed")
          )
            return true;
          return false;
        });
      }

      function filteredCards() {
        const cards = filteredCardsBase();
        if (state.filter === "all") return cards;
        if (state.filter === "open") return cards.filter((x) => isOpenKind(x.kind));
        return cards.filter((x) => x.kind === state.filter);
      }

      function renderCards() {
        const cards = filteredCards();
        if (!cards.length) {
          const hint =
            state.filter !== "all"
              ? `No ${state.filter === "open" ? "still-open" : state.filter} items for ${state.quarterKey || "this view"}.`
              : state.quarterKey
                ? "No cards for this quarter yet — click the selected quarter again to show all quarters."
                : "No items for this filter.";
          el("cards").innerHTML = `<div class="empty">${escapeHtml(hint)}</div>`;
          return;
        }
        el("cards").innerHTML = cards
          .map((c) => {
            const tag = c.kind || "open";
            const status = c.status ? ` · ${escapeHtml(c.status)}` : "";
            return `<button type="button" class="card ${state.activeId === c.id ? "active" : ""}" data-id="${escapeHtml(c.id)}">
              <div class="row">
                <span class="tag ${tag}">${escapeHtml(tag)}</span>
                <span class="qtr">${escapeHtml(c.quarter || "")}${status}</span>
              </div>
              <strong>${escapeHtml(c.title)}</strong>
              <p>${escapeHtml(c.body || c.quote || "")}</p>
              <div class="jump">open in transcript →</div>
            </button>`;
          })
          .join("");
        el("cards").onclick = (e) => {
          const b = e.target.closest("[data-id]");
          if (!b) return;
          openInsight(b.getAttribute("data-id"));
        };
      }

      /** Scroll only inside #transcript — never the page. */
      function scrollTranscriptToHit() {
        const container = el("transcript");
        const hit = document.getElementById("hit");
        if (!container || !hit) return;
        // offsetTop is relative to offsetParent; keep mark as direct content child
        const top = hit.offsetTop - Math.max(40, Math.floor(container.clientHeight * 0.2));
        container.scrollTop = Math.max(0, top);
      }

      /** Expand a hit into surrounding paragraph(s) so multi-line insight context is visible. */
      function expandToPassage(text, start, seedLen) {
        if (!text || start < 0) return null;
        const n = text.length;
        // Prefer blank-line paragraph boundaries; fall back to sentence-ish breaks.
        const paraBreak = /\n\s*\n/;
        // Walk left to previous double-newline
        let from = start;
        while (from > 0) {
          const slice = text.slice(Math.max(0, from - 2), from);
          if (paraBreak.test(slice) || text.slice(from - 1, from) === "\n" && text.slice(from - 2, from - 1) === "\n") {
            break;
          }
          // also stop at a lone newline followed by speaker-like "Name:"
          if (from > 1 && text[from - 1] === "\n") {
            const look = text.slice(from, Math.min(n, from + 60));
            if (/^[A-Z][A-Za-z .'-]{2,40}\s*:/.test(look)) break;
          }
          from--;
          if (start - from > 900) break; // safety
        }
        // Walk right to next double-newline or speaker turn
        let to = Math.min(n, start + Math.max(seedLen, 1));
        while (to < n) {
          if (text[to] === "\n" && text[to + 1] === "\n") {
            to += 2;
            break;
          }
          if (text[to] === "\n") {
            const look = text.slice(to + 1, Math.min(n, to + 61));
            if (/^[A-Z][A-Za-z .'-]{2,40}\s*:/.test(look)) break;
          }
          to++;
          if (to - start > 1200) break;
        }
        // Ensure we cover at least ~2–4 lines of body
        const minLen = 280;
        if (to - from < minLen) {
          from = Math.max(0, start - 120);
          to = Math.min(n, start + Math.max(seedLen, minLen - 120));
        }
        // Trim outer whitespace/newlines for cleaner mark
        while (from < to && /\s/.test(text[from])) from++;
        while (to > from && /\s/.test(text[to - 1])) to--;
        if (to <= from) return { start, len: Math.min(160, n - start) };
        return { start: from, len: to - from };
      }

      /** Find best char start/len for a quote or card title inside transcript text. */
      function findInTranscript(text, quote, title) {
        const attempts = [];
        const push = (s) => {
          const v = String(s || "").trim();
          if (v.length >= 10) attempts.push(v);
        };
        push(quote);
        push(title);
        for (const s of [quote, title]) {
          if (!s) continue;
          const words = String(s).split(/\s+/).filter(Boolean);
          if (words.length >= 4) push(words.slice(0, 10).join(" "));
          if (words.length >= 4) push(words.slice(0, 6).join(" "));
          if (words.length >= 3) push(words.slice(0, 4).join(" "));
        }
        const stop = new Set(["which","their","about","would","could","should","after","before","being","there","these","those","with","from","that","this","have","will","into","over","under","ratio","growth","quarter"]);
        const tokens = String(title || quote || "")
          .split(/[^A-Za-z0-9%'.-]+/)
          .filter((w) => w.length >= 5 && !stop.has(w.toLowerCase()));
        for (const tok of tokens.slice(0, 8)) push(tok);

        const lower = text.toLowerCase();
        for (const attempt of attempts) {
          let idx = text.indexOf(attempt);
          if (idx < 0) idx = lower.indexOf(attempt.toLowerCase());
          if (idx < 0) {
            const flatAttempt = attempt.replace(/\s+/g, " ").toLowerCase();
            const flatText = text.replace(/\s+/g, " ");
            const flatLower = flatText.toLowerCase();
            const fIdx = flatLower.indexOf(flatAttempt);
            if (fIdx >= 0) {
              idx = Math.min(text.length - 1, Math.floor((fIdx / flatText.length) * text.length));
              const needle = attempt.split(/\s+/).slice(0, 4).join(" ");
              const windowStart = Math.max(0, idx - 200);
              const window = text.slice(windowStart, windowStart + 800);
              const local = window.toLowerCase().indexOf(needle.toLowerCase());
              if (local >= 0) idx = windowStart + local;
              else idx = -1;
            }
          }
          if (idx >= 0) {
            return expandToPassage(text, idx, Math.min(Math.max(attempt.length, 48), 200));
          }
        }
        return null;
      }

      function renderTxSelect() {
        const txs = state.data.transcripts || [];
        el("txSelect").innerHTML = txs.length
          ? txs
              .map(
                (t, i) =>
                  `<option value="${i}">${escapeHtml(t.fyQuarter)} · ${escapeHtml(t.callDate)}</option>`
              )
              .join("")
          : `<option value="">No transcripts</option>`;

        el("txSelect").onchange = () => {
          if (!state.txOpen) return;
          const idx = Number(el("txSelect").value);
          if (!Number.isFinite(idx)) return;
          state.txIndex = idx;
          const t = txs[idx];
          state.quarterKey = t ? t.fyQuarter.toUpperCase() : null;
          renderScore(state.data);
          renderChips(filteredCardsBase());
          renderCards();
          showTranscript(idx, null, null);
          el("txHint").textContent = t
            ? `${t.fyQuarter} — browsing this transcript`
            : "";
        };
      }

      el("txClose").addEventListener("click", () => {
        state.activeId = null;
        setTranscriptOpen(false);
        renderCards();
      });

      function showTranscript(index, quote, charOffset, title) {
        const txs = state.data.transcripts || [];
        const t = txs[index];
        if (!t) return;
        state.txIndex = index;
        el("txSelect").value = String(index);

        let hint = `${t.fyQuarter} · ${t.callDate}`;
        let hit = null;

        // Prefer live search in this transcript (more reliable than stale offsets)
        if (quote || title) {
          hit = findInTranscript(t.text, quote, title);
        }
        if (!hit && typeof charOffset === "number" && charOffset >= 0 && charOffset < t.text.length) {
          hit = expandToPassage(t.text, charOffset, 96);
        }

        let html;
        if (hit) {
          // hit is already an expanded passage from findInTranscript/expandToPassage.
          // Mark a tighter "core" around the seed match inside that passage.
          const p0 = hit.start;
          const p1 = hit.start + hit.len;
          // Approximate core: middle-ish 25–40% of passage, or first strong needle
          let c0 = p0;
          let c1 = p1;
          const needle = String(quote || title || "")
            .trim()
            .split(/\s+/)
            .slice(0, 6)
            .join(" ");
          if (needle.length >= 8) {
            const local = t.text.slice(p0, p1).toLowerCase().indexOf(needle.toLowerCase());
            if (local >= 0) {
              c0 = p0 + local;
              c1 = Math.min(p1, c0 + Math.max(needle.length, 40));
            }
          }
          if (c1 > c0 && (c0 > p0 || c1 < p1)) {
            html =
              escapeHtml(t.text.slice(0, p0)) +
              "<mark class='passage' id='hit'>" +
              escapeHtml(t.text.slice(p0, c0)) +
              "<mark class='core'>" +
              escapeHtml(t.text.slice(c0, c1)) +
              "</mark>" +
              escapeHtml(t.text.slice(c1, p1)) +
              "</mark>" +
              escapeHtml(t.text.slice(p1));
          } else {
            html =
              escapeHtml(t.text.slice(0, p0)) +
              "<mark class='passage' id='hit'>" +
              escapeHtml(t.text.slice(p0, p1)) +
              "</mark>" +
              escapeHtml(t.text.slice(p1));
          }
          const lines = (t.text.slice(p0, p1).match(/\n/g) || []).length + 1;
          hint += ` · highlighted ~${lines}-line passage`;
        } else {
          html = escapeHtml(t.text);
          hint += quote || title
            ? " · could not locate quote in this file"
            : " · pick a card to jump to the source line";
        }

        el("txHint").textContent = hint;
        el("transcript").innerHTML = html;

        // Wait for layout so clientHeight is correct, then scroll ONLY this pane
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (hit) scrollTranscriptToHit();
            else el("transcript").scrollTop = 0;
          });
        });
      }

      function resolveTxIndex(card) {
        const txs = state.data.transcripts || [];
        if (!txs.length) return -1;
        if (card.callDate) {
          const i = txs.findIndex((t) => t.callDate === card.callDate);
          if (i >= 0) return i;
        }
        if (card.sourceUrl) {
          const i = txs.findIndex((t) => t.sourceUrl === card.sourceUrl);
          if (i >= 0) return i;
        }
        const q = quarterKeyFromLabel(card.quarter);
        if (q) {
          const i = txs.findIndex((t) => t.fyQuarter.toUpperCase() === q);
          if (i >= 0) return i;
        }
        return state.txIndex || 0;
      }

      function openInsight(id) {
        state.activeId = id;
        const card = cardsFromData(state.data).find((x) => x.id === id);
        if (!card) return;

        const idx = resolveTxIndex(card);
        if (idx < 0) {
          el("err").textContent = "No transcript files yet — click Check for updates first.";
          renderCards();
          return;
        }

        const t = state.data.transcripts[idx];
        state.quarterKey = t.fyQuarter.toUpperCase();
        state.txIndex = idx;
        setTranscriptOpen(true);
        renderScore(state.data);
        renderChips(filteredCardsBase());
        renderCards();
        if (el("txSelect")) el("txSelect").value = String(idx);
        showTranscript(idx, card.quote || card.body, card.charOffset, card.title);
      }

      function renderAll(data) {
        state.data = data;
        state.filter = "all";
        state.activeId = null;
        const hist = quarterHistory(data);
        // Default: latest Indian-FY quarter selected (chips are newest → oldest)
        state.quarterKey = hist.length ? hist[0].quarter : null;
        const txs = data.transcripts || [];
        const latestIdx = state.quarterKey
          ? txs.findIndex((t) => t.fyQuarter.toUpperCase() === state.quarterKey)
          : 0;
        state.txIndex = latestIdx >= 0 ? latestIdx : 0;
        el("layout").hidden = false;
        setTranscriptOpen(false);
        el("transcript").textContent = "";
        renderScore(data);
        renderChips(filteredCardsBase());
        renderCards();
        renderTxSelect();
      }

      function mapStockResponse(data) {
        if (data.portfolioJson) return data;
        return data;
      }

      async function run(mode) {
        const symbol = el("symbol").value.trim().toUpperCase();
        if (!symbol) return;
        const gen = ++state.fetchGen;
        el("symbol").value = symbol;
        el("err").textContent = "";
        setMenuOpen(false);
        el("f").querySelectorAll("button").forEach((b) => {
          if (!b.closest("#symbolMenu")) b.disabled = true;
        });
        try {
          if (mode === "show") {
            const res = await fetch("/v1/stocks/" + encodeURIComponent(symbol));
            const data = await res.json();
            if (gen !== state.fetchGen) return;
            if (!res.ok) {
              clearView(
                data.error === "not_found" || data.status === "not_found"
                  ? `${symbol} is not available yet`
                  : data.error || res.statusText
              );
              return;
            }
            renderAll(mapStockResponse(data));
          } else {
            const res = await fetch("/refresh/" + encodeURIComponent(symbol), { method: "POST" });
            const data = await res.json();
            if (gen !== state.fetchGen) return;
            if (!res.ok) throw new Error(data.error || res.statusText);
            const showRes = await fetch("/v1/stocks/" + encodeURIComponent(symbol));
            const showData = await showRes.json();
            if (gen !== state.fetchGen) return;
            if (showRes.ok) renderAll(mapStockResponse(showData));
            else {
              clearView(
                showData.error === "not_found" || showData.status === "not_found"
                  ? `${symbol} is not available yet`
                  : showData.error || "No analysis cached yet — run Analyze first"
              );
            }
          }
        } catch (e) {
          if (gen !== state.fetchGen) return;
          clearView(e.message || String(e));
        } finally {
          if (gen === state.fetchGen) {
            el("f").querySelectorAll("button").forEach((b) => (b.disabled = false));
          }
        }
      }

      el("f").addEventListener("submit", (e) => {
        e.preventDefault();
        run("show");
      });
      el("updateBtn").addEventListener("click", () => run("update"));

      const symbolInput = el("symbol");
      symbolInput.addEventListener("focus", () => {
        loadSymbolList();
        renderSymbolMenu();
        setMenuOpen(true);
      });
      symbolInput.addEventListener("input", () => {
        el("err").textContent = "";
        renderSymbolMenu();
        setMenuOpen(true);
        const q = symbolInput.value.trim().toUpperCase();
        // Drop stale stock UI as soon as typed query matches nothing available
        if (state.data && q && filteredSymbols(q).length === 0) {
          state.fetchGen += 1; // cancel in-flight show/update
          clearView("");
        }
      });
      symbolInput.addEventListener("keydown", (e) => {
        if (!state.menuOpen && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
          renderSymbolMenu();
          setMenuOpen(true);
        }
        const matches = filteredSymbols(symbolInput.value);
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (!matches.length) return;
          state.menuActive = Math.min(state.menuActive + 1, matches.length - 1);
          renderSymbolMenu();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!matches.length) return;
          state.menuActive = Math.max(state.menuActive - 1, 0);
          renderSymbolMenu();
        } else if (e.key === "Enter" && state.menuOpen && state.menuActive >= 0) {
          e.preventDefault();
          pickSymbol(matches[state.menuActive]);
        } else if (e.key === "Escape") {
          setMenuOpen(false);
        }
      });
      el("symbolMenu").addEventListener("mousedown", (e) => {
        const btn = e.target.closest("button[data-symbol]");
        if (!btn) return;
        e.preventDefault();
        pickSymbol(btn.getAttribute("data-symbol"));
      });
      document.addEventListener("click", (e) => {
        if (!el("symbolSearch").contains(e.target)) setMenuOpen(false);
      });

      loadSymbolList().then(() => {
        const params = new URLSearchParams(location.search);
        const fromUrl = (params.get("symbol") || "").trim().toUpperCase();
        if (fromUrl) {
          symbolInput.value = fromUrl;
          run("show");
          return;
        }
        if (state.symbols.length) {
          symbolInput.value = state.symbols[0];
          run("show");
        } else {
          clearView("No analyzed stocks yet — backfill still running");
        }
      });
      setInterval(loadSymbolList, 20000);
    </script>
  </body>
</html>
