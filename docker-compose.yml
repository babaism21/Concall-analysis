services:
  postgres:
    image: postgres:16
    container_name: concall-postgres
    environment:
      POSTGRES_USER: concall
      POSTGRES_PASSWORD: concall
      POSTGRES_DB: concall
    ports:
      - "5432:5432"
    volumes:
      - concall_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concall -d concall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  concall_pg_data:
